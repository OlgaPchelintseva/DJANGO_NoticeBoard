{% extends 'notice/base.html' %}
{% block title %} Вход {% endblock %}

{% block content %}
  <h1 class="text-pink-900 text-2xl font-bold text-center mt-12 mb-6">Вход</h1>

  <form method="post" class="max-w-md w-full m-auto p-8 rounded-3xl bg-gradient-to-br from-white via-zinc-50 to-zinc-100 border border-zinc-200 shadow-sm">
    {% csrf_token %}
    <div class="flex flex-col gap-2 mb-6">
      <label for="{{ form.username.id_for_label }}" class="text-slate-700 font-medium">Логин</label>
      {{ form.username }}
    </div>

    <div class="flex flex-col gap-2 mb-8">
      <label for="{{ form.password.id_for_label }}" class="text-slate-700 font-medium">Пароль</label>
      {{ form.password }}
    </div>

    <button type="submit" class="w-full bg-pink-600 text-white py-3 rounded-xl font-semibold hover:bg-pink-700 active:scale-[0.98] transition-all duration-200 drop-shadow-md">
      Войти
    </button>

    <p class="text-center text-slate-500 text-sm mt-6">
      Нет аккаунта?
      <a href="{% url 'notice:register' %}" class="text-teal-600 hover:underline font-medium">Зарегистрироваться</a>
    </p>
  </form>
{% endblock %}
